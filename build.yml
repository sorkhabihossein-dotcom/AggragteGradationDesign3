name: Build Windows installer
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --windowed --name AsphaltGradationDesign asphalt_gradation_design.py
      - run: choco install innosetup -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: AsphaltGradationDesign_Setup
          path: Output/AsphaltGradationDesign_Setup.exe
